# 모니터링 서버 (Prometheus + Grafana). 앱과 다른 서버에서 띄운다.
#   1) prometheus/prometheus.yml 의 APP_HOST를 앱 서버 주소로 바꾼다
#   2) docker compose up -d
#   3) Grafana http://이서버:3000 (처음 로그인 admin / GRAFANA_ADMIN_PASSWORD, 기본 admin)
services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d      # 지표 보관 기간
      - --web.enable-lifecycle                 # 설정 바꾼 뒤 재시작 없이 /-/reload
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.1.8
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      # 데이터소스(Prometheus)와 대시보드를 코드로 등록 → 화면에서 클릭해서 만들 필요 없음
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
