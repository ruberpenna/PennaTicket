# 이 폴더(config-example)를 config로 복사한 뒤 값을 채운다:  cp -r config-example config
# ./config/ 는 .gitignore에 들어 있어서 커밋되지 않는다. Spring Boot가 실행 시 자동으로 읽는다.

# PostgreSQL (비밀번호는 pgpass.conf 또는 환경 변수 SPRING_DATASOURCE_PASSWORD)
spring.datasource.url=jdbc:postgresql://DB서버주소:5432/ticketing

# Redis
spring.data.redis.host=Redis서버주소
spring.data.redis.password=Redis비밀번호

# Kafka
spring.kafka.bootstrap-servers=Kafka서버주소:9092

# JWT 서명 키 (32자 이상 임의 문자열). 비워 두면 기동할 때마다 새 키 → 재시작 시 재로그인 필요
# ticketing.jwt.secret=
